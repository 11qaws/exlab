name: Apply Roulette large live layout

on:
  push:
    branches:
      - fix/roulette-large-live-layout

permissions:
  contents: write

concurrency:
  group: roulette-large-live-layout
  cancel-in-progress: false

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the working branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply the reviewed Roulette layout patch
        run: node .automation/apply-roulette-large-live-layout.mjs

      - name: Give the roomy spin wheel more vertical canvas
        run: |
          python3 - <<'PY'
          from pathlib import Path

          css_path = Path('app/games/roulette/styles/roulette-live-info.css')
          css = css_path.read_text(encoding='utf-8')
          marker = (
              "  :scope .app-shell--live .broadcast-action-dock--presenting\n"
              "    .broadcast-action-dock__button:disabled {\n"
              "    cursor: progress;\n"
              "    opacity: 0.78;\n"
              "  }\n"
              "}"
          )
          replacement = (
              "  :scope .app-shell--live .broadcast-action-dock--presenting\n"
              "    .broadcast-action-dock__button:disabled {\n"
              "    cursor: progress;\n"
              "    opacity: 0.78;\n"
              "  }\n\n"
              "  /* A normal spin uses an in-wheel winner card, so it can spend less\n"
              "     height on the external Dart proof band and keep the disc dominant. */\n"
              "  :scope .app-shell--live .broadcast-focus__visual\n"
              "    .roulette-wheel.roulette-wheel:not(.is-dart) {\n"
              "    --wheel-proof-band: 4rem;\n"
              "  }\n"
              "}"
          )
          if css.count(marker) != 1:
              raise SystemExit('roomy live-frame marker was not unique')
          css_path.write_text(css.replace(marker, replacement), encoding='utf-8')

          test_path = Path('tests/roulette-large-live-layout.test.ts')
          tests = test_path.read_text(encoding='utf-8')
          test_marker = "  assert.ok(css.includes(\"'action action results'\"));\n"
          if tests.count(test_marker) != 1:
              raise SystemExit('large-layout contract marker was not unique')
          tests = tests.replace(
              test_marker,
              test_marker + '  assert.ok(css.includes("--wheel-proof-band: 4rem"));\n',
          )
          test_path.write_text(tests, encoding='utf-8')

          log_path = Path('DEVELOPMENT_LOG.md')
          log = log_path.read_text(encoding='utf-8')
          log_marker = '- 1600×850부터 embedded 라이브 셸 전체를 단계적으로 확대하고 역비율 폭·높이를 적용해 원판, 레일, 결과판, 버튼과 글자가 같은 비율로 커지도록 했다. 1440px 이하의 기존 반응형 구간과 모바일 순서는 변경하지 않았다.\n'
          if log.count(log_marker) != 1:
              raise SystemExit('development-log layout marker was not unique')
          log = log.replace(
              log_marker,
              log_marker + '- 넓은 일반 회전 화면에서는 다트 전용 외부 판독 여백을 쓰지 않아 원판이 무대 높이의 중심을 차지하도록 하고, 다트 모드의 판독 여백은 그대로 보존했다.\n',
          )
          log_path.write_text(log, encoding='utf-8')
          PY

      - name: Set deployment version to 1.3.42
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path_name, old, new, expected):
              path = Path(path_name)
              source = path.read_text(encoding='utf-8')
              count = source.count(old)
              if count != expected:
                  raise SystemExit(
                      f'{path_name}: expected {expected} occurrences of {old!r}, found {count}'
                  )
              path.write_text(source.replace(old, new), encoding='utf-8')

          replace_exact('package.json', '"version": "1.3.41"', '"version": "1.3.42"', 1)
          replace_exact('package-lock.json', '"version": "1.3.41"', '"version": "1.3.42"', 2)
          replace_exact('app/_platform/catalog.ts', 'version: "1.3.41"', 'version: "1.3.42"', 2)
          replace_exact(
              'app/games/showdown/ShowdownGame.tsx',
              'SHOWDOWN · VERSION 1.3.41',
              'SHOWDOWN · VERSION 1.3.42',
              1,
          )

          test_path = Path('tests/rendered-html.test.mjs')
          tests = test_path.read_text(encoding='utf-8')
          if tests.count('1.3.41') != 2 or tests.count(r'1\.3\.41') != 4:
              raise SystemExit('rendered-html version contract did not match 1.3.41')
          tests = tests.replace('1.3.41', '1.3.42')
          tests = tests.replace(r'1\.3\.41', r'1\.3\.42')
          test_path.write_text(tests, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme_marker = (
              '# exlab\n\n'
              'exlab은 하나의 실용적인 운영 셸에서 `Roulette`와 `Showdown`을 선택해 실행하는 게임 도구입니다. 현재 버전은 `1.3.41`입니다.\n\n'
              '## 1.3.41 Showdown 모바일 마블 이름표\n'
          )
          readme_replacement = (
              '# exlab\n\n'
              'exlab은 하나의 실용적인 운영 셸에서 `Roulette`와 `Showdown`을 선택해 실행하는 게임 도구입니다. 현재 버전은 `1.3.42`입니다.\n\n'
              '## 1.3.42 Roulette 대형 라이브 프레임\n\n'
              '- 추첨 중에도 참여자 명단, 누적 결과판과 하단 진행 도크를 유지해 대형 화면이 빈 무대로 바뀌지 않습니다.\n'
              '- 1600px 이상에서는 룰렛뿐 아니라 글자·레일·버튼을 포함한 라이브 UI 전체를 화면 크기에 맞춰 단계적으로 확대합니다.\n'
              '- 넓은 일반 회전 화면은 원판 판독 공간을 확대하고, 우상단의 중복 `결과 고정` 배지는 제거했습니다. 다트 판독 여백과 작은 화면 배치는 유지합니다.\n\n'
              '## 1.3.41 Showdown 모바일 마블 이름표\n'
          )
          if readme.count(readme_marker) != 1:
              raise SystemExit('README release marker was not unique')
          readme_path.write_text(
              readme.replace(readme_marker, readme_replacement),
              encoding='utf-8',
          )

          log_path = Path('DEVELOPMENT_LOG.md')
          log = log_path.read_text(encoding='utf-8')
          old_heading = '## 2026-08-06 Roulette 대형 라이브 프레임 유지'
          if log.count(old_heading) != 1:
              raise SystemExit('development-log release heading was not unique')
          log_path.write_text(
              log.replace(
                  old_heading,
                  '## 2026-08-07 1.3.42 Roulette 대형 라이브 프레임 유지',
              ),
              encoding='utf-8',
          )
          PY

      - name: Normalize temporary browser validator expressions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.automation/validate-roulette-large-live-layout.mjs')
          lines = path.read_text(encoding='utf-8').splitlines()
          normalized = []
          for line in lines:
              if 'Boolean(document.querySelector' in line and 'select[aria-label=' in line:
                  normalized.append('      `Boolean(document.querySelector(\'select[aria-label="게임 선택"]\'))`,')
              elif '?.click()' in line and 'data-action-id=' in line and 'start-draw' in line:
                  normalized.append('      `document.querySelector(\'.roulette-game [data-action-id="start-draw"]\')?.click(); true`,')
              else:
                  normalized.append(line)
              if line.strip() == 'assert.equal(geometry.viewport.width, 2048);':
                  normalized.insert(-1, '    console.log(JSON.stringify(geometry, null, 2));')
          path.write_text('\n'.join(normalized) + '\n', encoding='utf-8')
          PY
          node --check .automation/validate-roulette-large-live-layout.mjs

      - name: Lint
        run: npm run lint

      - name: Build and run the full application test suite
        run: npm run test:ci

      - name: Build the GitHub Pages mirror
        run: npm run pages:build

      - name: Verify the GitHub Pages mirror
        run: npm run pages:verify

      - name: Validate the 2048×944 live motion frame in Chromium
        run: node .automation/validate-roulette-large-live-layout.mjs

      - name: Upload the visual validation evidence
        uses: actions/upload-artifact@v4
        with:
          name: roulette-large-live-layout-validation
          path: /tmp/exlab-roulette-large-live
          if-no-files-found: error
          retention-days: 7

      - name: Remove one-shot patch helpers
        run: git rm -r .automation

      - name: Commit the validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app tests README.md DEVELOPMENT_LOG.md package.json package-lock.json
          git diff --cached --stat
          git commit -m "release: exlab 1.3.42 Roulette live frame [skip ci]"
          git push origin HEAD:fix/roulette-large-live-layout
